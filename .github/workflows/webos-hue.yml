name: webOS Hue test package
on:
  push:
    branches: [webos-hue-package]
permissions:
  contents: read

env:
  HUE_REV: 9efb0849d494b2a0af2bc05d858f8fb7504cde1e
  SDK_REV: a38c582ea397fec612811f8e933ae982d41fc5a3
  SDK: /opt/arm-webos-linux-gnueabi_sdk-buildroot
  APP_ID: org.webosbrew.hyperhdr.loader
  TEST_VERSION: 22.0.9

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore the Qt 6 webOS SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk.tar.gz
          key: webos-qt6-${{ env.SDK_REV }}-v1
      - name: Check out the loader's pinned Buildroot
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: openlgtv/buildroot-nc4
          ref: ${{ env.SDK_REV }}
          path: buildroot
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cpio rsync bc flatbuffers-compiler qemu-user
      - name: Build the same Qt 6 SDK as webosbrew loader v22.0.1
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: buildroot
        run: |
          make webos_tv_defconfig
          cat >> .config <<'CONFIG'
          BR2_PACKAGE_QT5=n
          BR2_PACKAGE_QT6=y
          BR2_PACKAGE_QT6BASE_NETWORK=y
          BR2_PACKAGE_QT6SERIALPORT=y
          BR2_PACKAGE_ICU=n
          CONFIG
          patches=https://gist.githubusercontent.com/sundermann/eec535ef79adb87367a6030f713d5e27/raw/20b9add1b41e0c0c55dd11aaeff41160eebe9693
          for patch in em_aarch64 statvfs; do
            curl -fsSL --retry 3 "$patches/$patch.patch" -o "package/qt6/qt6base/$patch.patch"
          done
          make olddefconfig
          make sdk
          mv output/images/*_sdk-buildroot*.tar.gz ../sdk.tar.gz
      - name: Cache SDK for later builds
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sdk.tar.gz
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Prepare SDK
        run: |
          tar xzf sdk.tar.gz -C /opt
          "$SDK/relocate-sdk.sh"
          find "$SDK/bin" -type f -iname 'perl*' -delete
      - name: Check out the Hue branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HUE_REV }}
          path: hyperhdr
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Test zone balancing and cross-compile HyperHDR
        working-directory: hyperhdr
        run: |
          cmake -S tests/hue_zone_brightness -B build/test -G Ninja
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure
          cmake -S . -B build/tv -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$SDK/share/buildroot/toolchainfile.cmake" \
            -DPLATFORM=linux -DENABLE_SPI_FTDI=ON -DENABLE_SPIDEV=ON \
            -DENABLE_V4L2=OFF -DENABLE_X11=OFF -DENABLE_PIPEWIRE=OFF \
            -DENABLE_SOUNDCAPLINUX=OFF -DENABLE_CEC=OFF -DENABLE_PROTOBUF=OFF \
            -DENABLE_FRAMEBUFFER=OFF -DENABLE_POWER_MANAGEMENT=OFF \
            -DUSE_EMBEDDED_WEB_RESOURCES=ON
          cmake --build build/tv --parallel 3
      - name: Check out the packaging script
        uses: actions/checkout@v4
        with:
          path: packaging
          persist-credentials: false
      - name: Package the ARM executable with the matching release loader
        run: |
          stock="${APP_ID}_22.0.1_all.ipk"
          curl -fsSL --retry 3 "https://github.com/webosbrew/hyperhdr-webos-loader/releases/download/v22.0.1/$stock" -o "$stock"
          echo "1341e25c1ebb6eeea172485dc885acb44c93d79bc5ac5ce698ed721664671f08  $stock" | sha256sum -c -
          mkdir -p dist
          python3 packaging/package_ipk.py "$stock" hyperhdr/build/tv/bin/hyperhdr "$TEST_VERSION" "dist/${APP_ID}_${TEST_VERSION}_all.ipk"
          cd dist
          sha256sum *.ipk > SHA256SUMS
      - name: Exercise the packaged engine and loader libraries
        id: arm-test
        run: |
          gcc=( "$SDK"/bin/*-gcc )
          sysroot="$("${gcc[0]}" -print-sysroot)"
          service="usr/palm/services/${APP_ID}.service/hyperhdr"
          for tree in stock updated; do mkdir -p "$tree"; done
          ar p "${APP_ID}_22.0.1_all.ipk" data.tar.gz | tar -xz -C stock
          ar p dist/*.ipk data.tar.gz | tar -xz -C updated
          stock_libs="$PWD/stock/$service"
          libs="$PWD/updated/$service"
          runner=(qemu-arm -cpu cortex-a15 -L "$sysroot" -E OPENSSL_armcap=0)
          if ! "${runner[@]}" -E "LD_LIBRARY_PATH=$stock_libs" "$stock_libs/hyperhdr" --service --version; then
            echo "The unmodified LG release also fails to start under QEMU. Running the integration test natively."
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            python3 hyperhdr/tests/processing_defaults/smoke.py "${runner[@]}" -E "LD_LIBRARY_PATH=$libs" "$libs/hyperhdr"
          fi
      - name: Exercise the same revision on Linux if the stock LG engine cannot start under QEMU
        if: steps.arm-test.outputs.native == 'true'
        working-directory: hyperhdr
        run: |
          sudo apt-get install -y qt6-base-dev qt6-serialport-dev libturbojpeg0-dev libusb-1.0-0-dev libzstd-dev
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SYSTRAY=OFF -DENABLE_X11=OFF -DENABLE_PIPEWIRE=OFF -DENABLE_V4L2=OFF \
            -DENABLE_SOUNDCAPLINUX=OFF -DENABLE_CEC=OFF -DENABLE_POWER_MANAGEMENT=OFF \
            -DENABLE_SPI_FTDI=OFF -DENABLE_PROTOBUF=OFF -DUSE_EMBEDDED_WEB_RESOURCES=ON
          cmake --build build/host --parallel 3 --target hyperhdr
          python3 tests/processing_defaults/smoke.py build/host/bin/hyperhdr
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hyperhdr-webos-hue-${{ env.TEST_VERSION }}
          path: dist/
          if-no-files-found: error
